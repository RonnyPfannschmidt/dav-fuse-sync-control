name: cargo-deny

on:
  schedule:
    - cron: '17 5 * * 1'
  push:
    paths: ['**/Cargo.toml', '**/Cargo.lock', 'deny.toml', '.github/workflows/deny.yml']
  pull_request:
    paths: ['**/Cargo.toml', '**/Cargo.lock', 'deny.toml', '.github/workflows/deny.yml']

jobs:
  deny:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans sources
