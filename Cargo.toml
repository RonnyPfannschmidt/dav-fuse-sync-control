[package]
name = "davfs-sync"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "WebDAV FUSE filesystem with offline metadata cache and sync control"
repository = "https://github.com/RonnyPfannschmidt/dav-fuse-sync-control"
license = "MIT OR Apache-2.0"

# Integration tests cannot import a binary target, so the crate must expose a
# library. Everything lives in the lib; the bin is a thin entry point.
[lib]
name = "davfs_sync"
path = "src/lib.rs"

[[bin]]
name = "davfs-sync"
path = "src/main.rs"

[dependencies]
# FUSE implementation.
# default-features = false drops the `libfuse` feature, and with it the
# pkg-config build dependency -- which is what .cargo/config.toml used to exist
# to satisfy. fuser then uses its pure-Rust mount path and shells out to the
# `fusermount3` binary at runtime.
fuser = { version = "0.18", default-features = false }

# Async runtime
tokio = { version = "1", features = ["full"] }
futures = "0.3"

# HTTP/WebDAV client.
# rustls rather than the default native-tls: it removes the only system library
# dependency (openssl-sys) from the build.
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
    "http2",
    "charset",
    "stream",
] }
url = "2.5"
percent-encoding = "2.3"

# WebDAV response parsing. Namespace-aware, so `d:`, `D:` and default-namespace
# servers are all handled without ever writing a prefix string.
quick-xml = "0.41"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }

# CLI
clap = { version = "4.5", features = ["derive"] }

# Secret storage (GNOME Keyring / Secret Service).
# The rt-tokio-crypto-rust feature keeps this pure Rust (zbus), so there is no
# libdbus-1 build dependency.
secret-service = { version = "4", features = ["rt-tokio-crypto-rust"] }

# Configuration
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Filesystem utils
libc = "0.2"
dirs = "5.0"

# Password input
rpassword = "7.3"

[dev-dependencies]
tempfile = "3"
insta = { version = "1", features = ["yaml", "filters"] }
